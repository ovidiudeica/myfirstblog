name: Site validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build with locked Jekyll gems (no managed Pages container)
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ovidiudeica/myfirstblog
        run: |
          bundle exec ruby -rbundler -e 'bad = Bundler.load.specs.map(&:name) & %w[github-pages jekyll-remote-theme rubyzip]; abort "Unexpected gems: #{bad.join(", ")}" unless bad.empty?'
          bundle exec jekyll build --config _config.yml,.github/pages-actions.yml

      - name: Reject Ruby gems with known advisories
        run: |
          gem install bundler-audit --version 0.9.3 --no-document
          bundle-audit check --update

      - name: Verify historic site content and preview asset
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          grep -Fq 'Welcome to my blog' _site/index.html
          test -s _site/2020/07/05/my-first-blog-post.html
          grep -Fq 'Testing' _site/2020/07/05/my-first-blog-post.html
          test -s _site/assets/images/og-preview-sharp.png

      - name: Validate homepage and article metadata with negative regressions
        run: python3 .github/scripts/check-metadata.py --negative-tests
