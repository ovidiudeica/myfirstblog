title: My First Blog
author: Ovidiu Deica
email: ovidiu.deica@yahoo.com
description: >-
  My First Blog is a simple personal website made with Jekyll and the Minima theme as a GitHub Learning Lab exercise. Hosted on GitHub Pages, it includes an introductory post from July 2020.
url: "https://ovidiudeica.github.io"
baseurl: "/myfirstblog"

# Default social preview image (does not change blog post content).
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      image:
        path: /assets/images/og-preview-sharp.png
        width: 1200
        height: 627
        alt: "My First Blog homepage preview"

  - scope:
      path: ""
      type: "posts"
    values:
      image:
        path: /assets/images/og-preview-sharp.png
        width: 1200
        height: 627
        alt: "My First Blog homepage preview"
      # Preserve the article's existing card type when adding its preview image.
      twitter:
        card: summary

# social links
linkedin_username: ovidiudeica # DO NOT include the @ character, or else the build will fail!
github_username:  ovidiudeica # DO NOT include the @ character, or else the build will fail!

show_excerpts: true # set to false to remove excerpts on the homepage

theme: minima
